<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vecteezy Scraper</title>
    <style>
        /* Importar uma fonte moderna (opcional, mas recomendado) */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');

        /* Reset Básico e Estilos Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111827; /* Cor de fundo escura, inspirada nos exemplos */
            color: #F9FAFB; /* Cor de texto principal (branco suave) */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        /* O Cartão Principal que contém o formulário */
        .scraper-container {
            background-color: #1F2937; /* Cor do cartão, um pouco mais clara que o fundo */
            padding: 2.5rem;
            border-radius: 16px; /* Cantos arredondados */
            border: 1px solid #374151;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }

        /* Título */
        .title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        /* Grupo de Formulário (Label + Input) */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #9CA3AF; /* Cor mais suave para as labels */
        }

        /* Estilo dos campos de input */
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 0.8rem 1rem;
            background-color: #374151; /* Fundo do input */
            border: 1px solid #4B5563;
            border-radius: 8px;
            color: #F9FAFB;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* Efeito ao focar no campo (clicar para escrever) */
        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #3B82F6; /* Cor de destaque azul */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4);
        }

        /* Estilo do Botão Principal */
        .submit-btn {
            width: 100%;
            padding: 0.9rem 1rem;
            background-color: #3B82F6; /* Cor de destaque azul, como nos exemplos */
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        /* Efeito ao passar o rato por cima do botão */
        .submit-btn:hover {
            background-color: #2563EB; /* Um azul um pouco mais escuro */
        }
        
        /* --- ESTILOS PARA A BARRA DE PROGRESSO --- */
        #progress-container {
            display: none; /* Começa escondido */
            text-align: center;
        }

        #progress-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #E5E7EB;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #374151;
            border-radius: 5px;
            overflow: hidden;
        }
        
        /* Esta é uma barra de progresso "indeterminada" que fica a animar */
        .progress-bar::before {
            content: '';
            display: block;
            width: 40%;
            height: 100%;
            background-color: #3B82F6;
            border-radius: 5px;
            animation: loading-animation 1.5s infinite ease-in-out;
        }

        @keyframes loading-animation {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(250%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <div class="scraper-container">
        
        <div id="form-container">
            <h1 class="title">Image Scraper</h1>
            <form id="scrape-form">
                
                <div class="form-group">
                    <label for="base_url">Base URL</label>
                    <input type="text" id="base_url" name="base_url" placeholder="https://www.vecteezy.com/..." required>
                </div>
                
                <div class="form-group">
                    <label for="nmr_pagina">Number of pages to scan</label>
                    <input type="number" id="nmr_pagina" name="nmr_pagina" min="1" value="1" required>
                </div>
                
                <button type="submit" class="submit-btn">Start Scraper & Download</button>

            </form>
        </div>

        <div id="progress-container">
            <h1 class="title">Scraping in Progress...</h1>
            <div id="progress-text">Starting job...</div>
            <div class="progress-bar"></div> <p style="margin-top: 1rem; color: #9CA3AF;">Please keep this tab open. Your download will start automatically.</p>
        </div>

    </div>

    <script>
        // --- 1. SELETORES MODIFICADOS ---
        const form = document.getElementById('scrape-form');
        const formContainer = document.getElementById('form-container');
        const progressContainer = document.getElementById('progress-container');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.querySelector('.progress-bar'); // <-- NOVO SELETOR
        
        let pollingInterval; // Variável para guardar o nosso loop de polling

        // --- 2. EVENT LISTENER MODIFICADO ---
        form.addEventListener('submit', async function (event) {
            event.preventDefault(); // Impede o envio normal do formulário

            // Esconde o formulário e mostra o progresso
            formContainer.style.display = 'none';
            progressContainer.style.display = 'block';
            progressBar.style.display = 'block'; // <-- ADICIONADO (garante que a barra reaparece)
            progressText.innerText = 'Starting job...'; // <-- ADICIONADO (reseta o texto)


            try {
                // Envia o pedido para /scrape
                const response = await fetch('/scrape', {
                    method: 'POST',
                    body: new FormData(form)
                });

                if (!response.ok) {
                    throw new Error('Failed to start scrape job.');
                }

                const data = await response.json();
                
                if (data.status === 'started' && data.job_id) {
                    // Começa a perguntar pelo progresso
                    startPolling(data.job_id);
                } else {
                    throw new Error('Invalid response from server.');
                }

            } catch (error) {
                progressText.innerText = `Error: ${error.message}`;
            }
        });

        // Função que pergunta ao servidor pelo estado
        function startPolling(jobId) {
            pollingInterval = setInterval(async () => {
                try {
                    // Adiciona um parâmetro aleatório para evitar o cache do browser
                    const response = await fetch(`/progress/${jobId}?_=${new Date().getTime()}`);

                    if (!response.ok) {
                        throw new Error('Server error checking progress.');
                    }
                    
                    const data = await response.json();

                    // Atualiza o texto de progresso
                    switch (data.status) {
                        case 'starting':
                            progressText.innerText = 'Job is starting...';
                            break;
                        case 'finding_links':
                            progressText.innerText = 'Scanning pages for links...';
                            break;
                        case 'downloading':
                            progressText.innerText = `Downloading assets: ${data.progress}`;
                            break;
                        
                        // --- 3. CASE 'COMPLETE' MODIFICADO ---
                        case 'complete':
                            progressText.innerText = 'Scrape complete! Preparing download...';
                            progressBar.style.display = 'none'; // <-- ADICIONADO (esconde a barra)
                            clearInterval(pollingInterval); // Para o loop
                            window.location.href = `/download/${jobId}`; // Inicia o download
                            
                            // Inicia um temporizador para reverter a UI para o formulário
                            setTimeout(() => {
                                progressContainer.style.display = 'none'; // Esconde o container de progresso
                                formContainer.style.display = 'block';    // Mostra o formulário novamente
                            }, 5000); // Espera 5 segundos (5000 ms)
                            
                            break;
                        // --- FIM DA MODIFICAÇÃO ---

                        case 'error':
                            throw new Error(data.error || 'An unknown error occurred.');
                        case 'not_found':
                             throw new Error('Job ID not found. Please try again.');
                    }

                } catch (error) {
                    clearInterval(pollingInterval); // Para o loop em caso de erro
                    progressText.innerText = `Error: ${error.message}`;
                    formContainer.style.display = 'block'; // Mostra o formulário novamente
                    progressContainer.style.display = 'none';
                }
            }, 2000); // Pergunta a cada 2 segundos
        }

    </script>

</body>
</html>
